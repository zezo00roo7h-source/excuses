<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سجل أعذار الطالبات</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#C2376F">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600&display=swap">
<style>
/* Layout: phone-first app shell — gradient top bar, soft cards, bottom tab bar; class → student → excuse */
:root{
  --bg:#FFF6F9; --surface:#FFFFFF; --surface-2:#FBEDF3; --ink:#2B1822; --muted:#84697A; --line:#F2DFE7;
  --accent:#C2376F; --accent-2:#8C1F52; --accent-ink:#FFFFFF; --accent-soft:#FCE3EE; --gold:#B98A3E;
  --danger:#B3403A; --warn-bg:#FFF1DC; --warn-ink:#7A5310;
  --c-medical:#C2376F; --c-appt:#4F63B8; --c-family:#8A4F9E; --c-death:#55686B; --c-travel:#A8740F; --c-other:#5E7D3A; --c-transport:#2F7F8C; --ok:#2E7D5B; --ok-bg:#E3F3EA;
  --shadow:0 1px 2px rgba(120,30,70,.06),0 6px 20px rgba(120,30,70,.07);
  --shadow-lg:0 14px 40px rgba(120,30,70,.20);
  --scrim:rgba(30,8,18,.5);
  --display:"Readex Pro","IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --r:20px; --r-sm:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#140C11; --surface:#1F141A; --surface-2:#2A1B24; --ink:#F8E9F0; --muted:#C4A4B5; --line:#36242E;
  --accent:#F0679E; --accent-2:#A62A62; --accent-ink:#FFFFFF; --accent-soft:#3B1C2C; --gold:#E2BF7E;
  --danger:#F08A84; --warn-bg:#3A2C14; --warn-ink:#F2D49A;
  --c-medical:#F0679E; --c-appt:#9AAAF0; --c-family:#CFA0DE; --c-death:#A3B5B8; --c-travel:#E2B65C; --c-other:#AFCB88; --c-transport:#7FC8D3; --ok:#7FD3AE; --ok-bg:#1D3A2E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 16px 48px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#140C11; --surface:#1F141A; --surface-2:#2A1B24; --ink:#F8E9F0; --muted:#C4A4B5; --line:#36242E;
  --accent:#F0679E; --accent-2:#A62A62; --accent-ink:#FFFFFF; --accent-soft:#3B1C2C; --gold:#E2BF7E;
  --danger:#F08A84; --warn-bg:#3A2C14; --warn-ink:#F2D49A;
  --c-medical:#F0679E; --c-appt:#9AAAF0; --c-family:#CFA0DE; --c-death:#A3B5B8; --c-travel:#E2B65C; --c-other:#AFCB88; --c-transport:#7FC8D3; --ok:#7FD3AE; --ok-bg:#1D3A2E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 16px 48px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6);
  color-scheme:dark }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent-2)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.4}
h1{font-size:1.1rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.wrap{max-width:680px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(115deg,var(--accent-2),var(--accent));color:var(--accent-ink);box-shadow:0 4px 18px color-mix(in srgb,var(--accent-2) 30%,transparent)}
.bar .wrap{display:flex;align-items:center;gap:6px;padding-block:8px}
.bar h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.01em}
.bar .icon-btn{color:var(--accent-ink)}
.bar .icon-btn:hover{background:rgba(255,255,255,.16)}
.bar :focus-visible{outline-color:var(--accent-ink)}
main.wrap{padding-block:18px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
@media (prefers-reduced-motion:no-preference){ main.wrap > *{animation:rise .28s ease-out both} @keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}} }

.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:14px;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--surface-2)}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 18px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;text-align:center;box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 32%,transparent)}
.btn.danger{color:var(--danger)}
.btn.small{min-height:42px;padding:6px 14px;font-size:.9rem;box-shadow:none}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .grow{flex:1 1 150px}
.vh{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1}

.head{display:flex;flex-direction:column;gap:2px}
.head h2{font-size:1.4rem}
.sub{color:var(--muted);font-size:.88rem}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:start;min-height:60px;color:var(--ink)}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.item .name{font-weight:500;overflow-wrap:anywhere}
.count{font-variant-numeric:tabular-nums;font-size:.8rem;font-weight:500;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 10px;flex:none;white-space:nowrap}
.count.has{background:var(--accent-soft);color:var(--accent)}
.count.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chev{color:var(--muted);flex:none;width:18px;height:18px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted);background:color-mix(in srgb,var(--surface) 60%,transparent)}
.empty svg{width:34px;height:34px;color:var(--accent);opacity:.7}

/* الواجهة الرئيسية */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:#fff;background:linear-gradient(140deg,var(--accent-2) 0%,var(--accent) 62%,color-mix(in srgb,var(--accent) 70%,#FFB3CF) 100%);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:16px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.hero::before{width:190px;height:190px;top:-80px;inset-inline-end:-50px}
.hero::after{width:120px;height:120px;bottom:-60px;inset-inline-start:30%}
.hero .head{position:relative;z-index:1}
.hero .hi{font-size:.95rem;opacity:.92}
.hero h2{font-size:1.55rem;color:#fff}
.hero .date{font-size:.85rem;opacity:.85}
.hstats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hstat{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.14);border-radius:16px;padding:10px 6px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hstat b{font-family:var(--display);font-size:1.45rem;line-height:1.3;font-variant-numeric:tabular-nums}
.hstat span{font-size:.76rem;opacity:.92}
.searchbox{position:relative}
.searchbox svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px;pointer-events:none}
.searchbox input{padding-inline-start:44px!important}
.ccards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ccard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:start;min-width:0;color:var(--ink);transition:transform .12s ease}
.ccard:active{transform:scale(.98)}
.ccard .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.ccard .name{font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.4;overflow-wrap:anywhere}
.ccard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* الطالبات */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:center;min-width:0;box-shadow:var(--shadow);color:var(--ink);transition:transform .12s ease}
.tile:active{transform:scale(.97)}
.av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.35rem;font-weight:600;color:var(--cc);background:color-mix(in srgb,var(--cc) 15%,var(--surface));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--cc) 22%,transparent)}
.tile .name{font-weight:500;overflow-wrap:anywhere;line-height:1.5}
.pagehead{display:flex;align-items:center;gap:14px}
.pagehead .av{width:60px;height:60px;font-size:1.5rem}
.pagehead .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.pagehead .head{min-width:0}

.search{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted)}
.field input,.field select,.field textarea,.search input{min-height:50px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:8px 14px;color:var(--ink);font-size:1rem;width:100%;min-width:0;box-shadow:var(--shadow);transition:border-color .15s ease,box-shadow .15s ease}
.field input:focus,.field select:focus,.field textarea:focus,.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.field textarea{min-height:96px;resize:vertical;line-height:1.7}
.daterow{display:flex;gap:10px;align-items:end}
.daterow .field{flex:1;min-width:0}

.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.notice .btn{align-self:flex-start;background:transparent;border-color:currentColor;color:inherit;box-shadow:none}

.excuse{display:flex;gap:12px;align-items:flex-start}
.thumb{width:62px;height:80px;border-radius:12px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);flex:none;display:grid;place-items:center;color:var(--muted)}
.chip{display:inline-block;font-size:.78rem;font-weight:600;padding:1px 10px;border-radius:999px;color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent);align-self:flex-start}
.dates{font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}

/* القفل */
.lock{min-height:76vh;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:380px;margin-inline:auto;width:100%}
.lock .mark{width:84px;height:84px;border-radius:28px;background:linear-gradient(140deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;box-shadow:var(--shadow-lg);align-self:center}
.lock .mark svg{width:40px;height:40px}
.lock .head{text-align:center;align-items:center}
.lock input[type=password]{text-align:center;font-size:1.4rem;letter-spacing:.35em}
.err{color:var(--danger);font-size:.9rem;min-height:1.4em;text-align:center}

/* النوافذ */
#modal{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg)}
.sheet::before{content:"";width:44px;height:5px;border-radius:99px;background:var(--line);align-self:center;flex:none}
.sheet form{display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.full-img{max-width:100%;border-radius:16px;border:1px solid var(--line);align-self:center}
.prev{display:flex;gap:12px;align-items:center}
#toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:.92rem;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow-lg)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.group > h2{display:flex;align-items:center;gap:10px;font-size:1.08rem}
.group > h2 svg{color:var(--accent);width:22px;height:22px}
.group .list{box-shadow:none}
.group .field input,.group .field select{box-shadow:none}
.photos{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:40px}
.ph{position:relative;display:block}
.ph-x{position:absolute;top:-8px;inset-inline-start:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;padding:0}
.ph-x svg{width:16px;height:16px}
.more{font-size:.8rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.stat b{font-family:var(--display);font-size:1.7rem;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:.84rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{min-height:40px;padding:4px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.9rem}
.chipbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.meters{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.meter{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2.5em;gap:10px;align-items:center;font-size:.92rem}
.meter-track{display:block;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter-fill{display:block;height:100%;border-radius:99px}
.meter .num{text-align:left;font-variant-numeric:tabular-nums;color:var(--muted)}
.gallery{display:flex;flex-direction:column;gap:10px}
.lowres{font-size:.85rem;color:var(--warn-ink);background:var(--warn-bg);border-radius:12px;padding:8px 12px}

.brows{display:flex;flex-direction:column;gap:12px}
.brow{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}
.brow .bf{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.brow .bnum{position:absolute;top:-8px;inset-inline-end:10px;font-size:.75rem;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 9px}
.brow .field input,.brow .field select{min-height:44px;box-shadow:none}
.brow .days{max-width:5.5em}
.brow select,.brow .bNote{min-height:44px;width:100%;border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--surface);color:var(--ink);font-size:1rem}
/* الحضور */
.arows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.arow{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow.abs{background:color-mix(in srgb,var(--danger) 7%,var(--surface))}
.atog{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:0;text-align:start;color:var(--ink);min-height:48px}
.atog .av{width:40px;height:40px;font-size:1.05rem}
.atog .name{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere;line-height:1.5}
.apill{flex:none;font-size:.8rem;font-weight:600;border-radius:99px;padding:3px 12px;background:var(--ok-bg);color:var(--ok)}
.arow.abs .apill{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.absReason{min-height:44px;width:100%;border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--surface);color:var(--ink);font-size:1rem}
.exhint{font-size:.8rem;color:var(--ok)}
.stickybar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:10px;padding:10px;margin-inline:-6px;border-radius:20px;background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.stickybar .btn{flex:1}
body:has(.stickybar) #toast{bottom:calc(156px + env(safe-area-inset-bottom,0px))}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--surface-2)}
.seg button{min-height:42px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
/* شريط التنقل السفلي */
.tabbar{position:fixed;inset:auto 0 0;z-index:20;display:flex;justify-content:space-around;gap:4px;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tab{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--muted);font-size:.76rem;font-weight:500;padding:4px;min-height:54px}
.tab .pill{display:grid;place-items:center;width:60px;height:32px;border-radius:99px;transition:background .15s ease}
.tab.on{color:var(--accent)}
.tab.on .pill{background:var(--accent-soft)}
</style>
</head>
<body>

<div id="app" dir="rtl" lang="ar">
  <header class="bar" id="bar" hidden>
    <div class="wrap">

async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin);
  try { const h = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let x = 5381; for (const b of data) x = ((x << 5) + x + b) >>> 0; return 'f' + x.toString(16); }
}

const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
function scaleTo(img, max, qual) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, r = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * r)); c.height = Math.max(1, Math.round(h * r));
  const x = c.getContext('2d', {willReadFrequently:true}); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', qual);
}
/* مدى الإضاءة في عيّنة صغيرة: قيمة قريبة من الصفر تعني صورة فارغة (بيضاء أو سوداء بالكامل) */
function rangeOf(src) {
  try {
    const c = document.createElement('canvas'); c.width = 48; c.height = 48; const x = c.getContext('2d', {willReadFrequently:true});
    x.fillStyle = '#fff'; x.fillRect(0, 0, 48, 48); x.drawImage(src, 0, 0, 48, 48);
    const d = x.getImageData(0, 0, 48, 48).data; let mn = 255, mx = 0;
    for (let i = 0; i < d.length; i += 4) { const l = (d[i] * 3 + d[i + 1] * 6 + d[i + 2]) / 10; if (l < mn) mn = l; if (l > mx) mx = l; }
    return mx - mn;
  } catch (e) { return 255; }
}
async function decodeFile(file) {
  try { return await createImageBitmap(file, {imageOrientation:'from-image'}); } catch (e) {}
  try { return await createImageBitmap(file); } catch (e) {}
  const url = URL.createObjectURL(file);
  try { const i = await loadImg(url); try { if (i.decode) await i.decode(); } catch (e) {} return i; } finally { setTimeout(() => URL.revokeObjectURL(url), 30000); }
}
async function processFile(file) {
  const src = await decodeFile(file);
  try {
    let full = scaleTo(src, 1600, .82), fi = await loadImg(full);
    // بعض الجوالات ترسم صورة المعرض الكبيرة فارغة في أول مرة قبل اكتمال فكّها: نعيد الرسم ونتحقق
    for (let k = 0; k < 3 && rangeOf(fi) < 6 && rangeOf(src) >= 6; k++) { await new Promise(r => setTimeout(r, 150 * (k + 1))); full = scaleTo(src, 1600, .82); fi = await loadImg(full); }
    return {full, thumb:scaleTo(fi, 200, .7)};
  } finally { if (src && src.close) src.close(); }
}
/* صورة محفوظة سابقاً فارغة؟ نعرض المصغّرة بدلها مع تنبيه */
async function photoSrc(p) {
  const r = await db.get('images', p.id); if (!r || !r.data) return null;
  try {
    const im = await loadImg(r.data); if (im.decode) await im.decode();
    if (rangeOf(im) < 6 && p.thumb) { const tm = await loadImg(p.thumb); if (rangeOf(tm) >= 6) return {src:p.thumb, img:tm, low:true}; }
    return {src:r.data, img:im, low:false};
  } catch (e) { return p.thumb ? {src:p.thumb, img:await loadImg(p.thumb), low:true} : null; }
}
function demoImage(line1, line2) {
  const c = document.createElement('canvas'); c.width = 800; c.height = 1100; const x = c.getContext('2d', {willReadFrequently:true});
  x.fillStyle = '#FBFAF6'; x.fillRect(0, 0, 800, 1100); x.strokeStyle = '#B9C4C2'; x.lineWidth = 3; x.strokeRect(40, 40, 720, 1020);
  x.direction = 'rtl'; x.textAlign = 'right'; x.fillStyle = '#1C2B2E';
  x.font = '600 44px Tahoma, sans-serif'; x.fillText('نموذج عذر تجريبي', 720, 150);
  x.font = '30px Tahoma, sans-serif'; x.fillText(line1, 720, 240); x.fillText(line2, 720, 300);
  x.strokeStyle = '#D5DCDA'; x.lineWidth = 2; for (let y = 400; y < 900; y += 60) { x.beginPath(); x.moveTo(90, y); x.lineTo(710, y); x.stroke(); }

async function seedDemo() {
  const names = ['أول ثانوي / 1', 'ثاني ثانوي / 2', 'ثالث ثانوي / 1'];
  const first = ['سارة','نورة','ريم','لمى','جود','دانة','هيا','غلا','شهد','رغد','ليان','تالا'], mid = ['أحمد','خالد','سعد','فهد','ماجد','ناصر'], last = ['التجريبي','النموذجي','المثالي','الافتراضي'];
  const plan = {'0-0':[['medical',4,'تقرير طبي — غياب يومين',2],['appt',16,'موعد عيادة أسنان']], '0-3':[['family',5,'ظرف عائلي طارئ']], '1-2':[['travel',9,'سفر مع الأسرة'],['medical',1,'إجازة مرضية يوم واحد']], '2-0':[['other',3,'تأخر صباحي بعذر']], '2-5':[['appt',0,'مراجعة مستشفى']]};
  const base = Date.now();
  for (let c = 0; c < names.length; c++) {
    const cid = 'c' + uid(); await db.put('classes', {id:cid, name:names[c], created:base + c});
    for (let i = 0; i < 8; i++) {
      const sid = 's' + uid() + i, name = first[(c * 4 + i) % 12] + ' ' + mid[(i + c) % 6] + ' ' + last[(i + 2 * c) % 4];
      await db.put('students', {id:sid, classId:cid, name});
      for (const [cat, ago, note, span] of (plan[c + '-' + i] || [])) {
        const d = new Date(); d.setDate(d.getDate() - ago); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        const eid = 'e' + uid(), im = demoImage('الطالبة: ' + name, 'النوع: ' + catName(cat));
        await db.put('images', {id:eid, data:im.full});
        const from = d.toISOString().slice(0, 10), t = new Date(from + 'T12:00:00'); t.setDate(t.getDate() + ((span || 1) - 1)); const to = isoOf(t);
        await db.put('excuses', {id:eid, studentId:sid, date:from, dateTo:to, days:schoolDays(from, to), category:cat, notes:note + ' (وهمي)', thumb:im.thumb, hasImage:true, created:Date.now()});
      }
    }
  }
  // تحضير وهمي لآخر أيام الدوام
  const allC = await db.all('classes'), allS = await db.all('students'); let seedN = 7;
  for (let back = 1, made = 0; made < 8 && back < 20; back++) {
    const dd = new Date(); dd.setDate(dd.getDate() - back); const iso = isoOf(dd); if (isWeekend(iso)) continue; made++;
    for (const c of allC) { const st = allS.filter(x => x.classId === c.id), absent = {}; for (const x of st) { seedN = (seedN * 37 + 11) % 101; if (seedN < 9) absent[x.id] = {reason:ABS[seedN % ABS.length][0]}; } await db.put('att', {id:attId(iso, c.id), date:iso, classId:c.id, absent, takenAt:Date.now()}); }
  }
  await db.put('meta', {id:'seed', demo:true});
}

      const list = await readNamesFile(f);
      if (!list.length) return toast('لم نجد أسماء في الملف. الصقي الأسماء يدوياً في المربع.');
      $('#bulkText').value = list.map(r => (r.nid ? r.nid + '  ' : '') + r.name).join('\n'); $('#bulkCount').textContent = list.length + ' اسم' + (list.some(r => r.nid) ? ' مع السجل المدني' : '') + ' — راجعي القائمة ثم اضغطي إضافة';
    } else if (t.id === 'restoreFile') await readRestore(f);
    else if (t.id === 'importFile') await readImport(f);
  } catch (err) {
    console.error(err);
    if (t.id === 'bulkFile') toast('تعذرت قراءة الملف. جرّبي حفظه بصيغة CSV أو الصقي الأسماء.');
    else if (t.id !== 'restoreFile') { if ($('#exSave')) $('#exSave').disabled = false; const st = $('#exPhStatus'); if (st) st.textContent = 'تعذرت قراءة الصورة، جرّبي صورة أخرى.'; }
  }
  t.value = '';
});
document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target;
  try {
    if (f.id === 'schoolForm') {
      const cl = id => $(id).value.replace(/\s+/g, ' ').trim();
      S.school = {id:'school', school:cl('#scSchool'), school2:cl('#scSchool2'), admin:cl('#scAdmin'), wakila:cl('#scWakila'), principal:cl('#scPrincipal')};
      await raw.put('meta', S.school); toast('حُفظت بيانات المدرسة');
    } else if (f.id === 'prefsForm') {
      S.prefs = {id:'prefs', alertDays:Math.min(99, Math.max(1, parseInt($('#pfAlert').value, 10) || 5)), autoLock:Number($('#pfLock').value) || 0, theme:$('#pfTheme').value, backupDays:Number($('#pfBackup').value) || 0, term:Number($('#pfTerm').value) || 1, termStart:$('#pfTermStart').value || ''};
      await raw.put('meta', S.prefs); applyTheme(); toast('حُفظت الإعدادات');
    } else if (f.id === 'createForm') {
      const a = $('#pin1').value.trim(), b = $('#pin2').value.trim();
      if (a.length < 6) return $('#lockErr').textContent = 'الرمز يجب أن يكون 6 خانات على الأقل.';
      if (a !== b) return $('#lockErr').textContent = 'الرمزان غير متطابقين.';
      DK = await newDK(); await wrapKey(a); await raw.put('meta', {id:'enc', done:true}); await enter();
    } else if (f.id === 'unlockForm') {
      const pin = $('#pin1').value.trim(), k = await raw.get('meta', 'key');
      const bad = () => { $('#pin1').value = ''; $('#lockErr').textContent = 'رمز الدخول غير صحيح.'; };
      $('#lockErr').textContent = 'جارٍ الفتح…';
      if (k) { DK = await openKey(pin, k); if (!DK) return bad(); }
      else {
        const p = await raw.get('meta', 'pin'); if (await hashPin(pin, p.salt) !== p.hash) return bad();
        DK = await newDK(); await wrapKey(pin); await raw.del('meta', 'pin');
      }
      await enter();
    } else if (f.id === 'pinForm') {
      const k = await raw.get('meta', 'key'), n = $('#pinNew').value.trim();
      if (!(await openKey($('#pinOld').value.trim(), k))) return $('#pinErr').textContent = 'الرمز الحالي غير صحيح.';
      if (n.length < 6) return $('#pinErr').textContent = 'الرمز الجديد يجب أن يكون 6 خانات على الأقل.';
      await wrapKey(n); closeModal(); toast('تم تغيير رمز الدخول');
    } else if (f.id === 'nameForm') {
      const v = $('#nameInput').value.replace(/\s+/g, ' ').trim(), kind = f.dataset.kind; if (!v) return;
      if (kind === 'addClass') { const c = {id:'c' + uid(), name:v, created:Date.now()}; await db.put('classes', c); S.classes.push(c); closeModal(); go({v:'cls', id:c.id}); return; }
      const o = kind === 'renameClass' ? cls(topId()) : stu(topId()); o.name = v; if (kind === 'renameStudent' && $('#nidInput')) { const raw = $('#nidInput').value.trim(), nid = cleanNid(raw); if (raw && !nid) return toast('رقم السجل المدني غير صحيح'); o.nid = nid; const ph = toLatin($('#phoneInput').value).replace(/[^0-9+]/g, ''); if (ph && ph.replace(/\D/g, '').length < 9) return toast('رقم الجوال غير صحيح'); o.phone = ph; } await db.put(kind === 'renameClass' ? 'classes' : 'students', o); closeModal(); render();
    } else if (f.id === 'bulkForm') {
      const cid = topId(), have = new Map(stuOf(cid).map(s => [norm(s.name), s])); let added = 0, upd = 0;
      for (const r of bulkEntries()) {
        const ex = have.get(norm(r.name));
        if (ex) { if (r.nid && ex.nid !== r.nid) { ex.nid = r.nid; await db.put('students', ex); upd++; } continue; }
        const s = {id:'s' + uid(), classId:cid, name:r.name, nid:r.nid || ''}; await db.put('students', s); S.students.push(s); have.set(norm(r.name), s); added++;
      }
      if (!added && !upd) return toast('لا توجد أسماء جديدة للإضافة');
      closeModal(); render(); toast((added ? 'أُضيفت ' + added + ' طالبة' : '') + (added && upd ? ' · ' : '') + (upd ? 'حُدّث السجل المدني لـ ' + upd : ''));
    } else if (f.id === 'batchForm') {
      if (!bp || !bp.rows.length) return; syncBatch(); $('#bSave').disabled = true;
      const sid = topId(), n = bp.rows.length;
      for (const o of bp.rows) {
        const iid = 'i' + uid(); await db.put('images', {id:iid, data:o.full});
        const ex = {id:'e' + uid(), studentId:sid, created:Date.now(), date:o.date || todayISO(), dateTo:o.date || todayISO(), days:o.days, category:o.cat, notes:(o.notes || '').trim(), photos:[{id:iid, thumb:o.thumb}], thumb:o.thumb, hasImage:true};
        await db.put('excuses', ex); S.excuses.push(ex);
      }
      closeModal(); render(); toast('حُفظت ' + (n === 1 ? 'عذر واحد' : n + ' أعذار')); try { if (navigator.vibrate) navigator.vibrate(15); } catch (err) {}
    } else if (f.id === 'exForm') {
      const date = $('#exDate').value, to = $('#exTo').value || date; if (!date) return toast('اختاري تاريخ العذر');
      if (to < date) return toast('تاريخ النهاية قبل تاريخ البداية');
      if (!fp) return;
      $('#exSave').disabled = true;
      const old = f.dataset.id ? S.excuses.find(x => x.id === f.dataset.id) : null;
      const ex = old || {id:'e' + uid(), studentId:topId(), created:Date.now()};
      ex.date = date; ex.dateTo = to; ex.days = Math.max(1, parseInt($('#exDays').value, 10) || schoolDays(date, to));
      ex.category = $('#exCat').value; ex.notes = $('#exNotes').value.trim();
      for (const p of fp.list) if (!p.id) { const id = 'i' + uid(); await db.put('images', {id, data:p.full}); p.id = id; delete p.full; }
      for (const id of fp.removed) await db.del('images', id);
      ex.photos = fp.list.map(p => ({id:p.id, thumb:p.thumb})); ex.thumb = ex.photos.length ? ex.photos[0].thumb : ''; ex.hasImage = ex.photos.length > 0;
      await db.put('excuses', ex); if (!old) S.excuses.push(ex);
      const nextCat = e.submitter && e.submitter.dataset.next ? ex.category : null;
      closeModal(); render(); toast(nextCat ? 'حُفظ العذر، أضيفي التالي' : 'حُفظ العذر'); try { if (navigator.vibrate) navigator.vibrate(15); } catch (err) {}
      if (nextCat) excuseForm(null, nextCat);
    }
  } catch (err) {
    console.error(err); const b = $('#exSave'); if (b) b.disabled = false;
    toast(err && err.name === 'QuotaExceededError' ? 'مساحة التخزين ممتلئة. احفظي نسخة احتياطية واحذفي أعذاراً قديمة.' : 'تعذر الحفظ، أعيدي المحاولة');
  }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
openDB().then(async d => { idb = d; try { S.prefs = (await raw.get('meta', 'prefs')) || {}; applyTheme(); } catch (e) {} return renderLock(); }).catch(() => renderLock());
})();
</script>
