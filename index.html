<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سجل أعذار الطالبات</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#C2376F">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600&display=swap">
<style>
/* Layout: one narrow column like a paper register — class → student → excuse, each level a full screen */
:root{
  --bg:#FBF1F4; --surface:#FFFFFF; --surface-2:#F6E1E8; --ink:#3A1F2B; --muted:#7E5A69; --line:#EFD3DC;
  --accent:#C2376F; --accent-ink:#FFFFFF; --accent-soft:#FADCE7; --danger:#A8433F; --warn-bg:#F4EBD6; --warn-ink:#6A4E12;
  --c-medical:#C2376F; --c-appt:#55659F; --c-family:#855A82; --c-death:#56686A; --c-travel:#97701F; --c-other:#647349;
  --display:"Readex Pro","IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1E1218; --surface:#2A1A22; --surface-2:#38232E; --ink:#F6E4EB; --muted:#C19DAC; --line:#452C38;
  --accent:#F07FAE; --accent-ink:#2A0D1A; --accent-soft:#4A2236; --danger:#E38C87; --warn-bg:#3A311B; --warn-ink:#EBD49A;
  --c-medical:#F07FAE; --c-appt:#9AA8DC; --c-family:#C99BC5; --c-death:#9FB0B2; --c-travel:#D9B25E; --c-other:#A9BA8A;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1E1218; --surface:#2A1A22; --surface-2:#38232E; --ink:#F6E4EB; --muted:#C19DAC; --line:#452C38;
  --accent:#F07FAE; --accent-ink:#2A0D1A; --accent-soft:#4A2236; --danger:#E38C87; --warn-bg:#3A311B; --warn-ink:#EBD49A;
  --c-medical:#F07FAE; --c-appt:#9AA8DC; --c-family:#C99BC5; --c-death:#9FB0B2; --c-travel:#D9B25E; --c-other:#A9BA8A;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.4}
h1{font-size:1.15rem} h2{font-size:1.35rem} h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:680px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--accent);color:var(--accent-ink)}
.bar .icon-btn{color:var(--accent-ink)}
.bar .icon-btn:hover{background:color-mix(in srgb,var(--accent-ink) 18%,transparent)}
.bar :focus-visible{outline-color:var(--accent-ink)}
.bar .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.bar h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main.wrap{padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}

.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:12px;cursor:pointer;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--surface-2)}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.small{min-height:40px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .grow{flex:1 1 150px}
.vh{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1}

.head{display:flex;flex-direction:column;gap:2px}
.sub{color:var(--muted);font-size:.9rem}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:start;cursor:pointer;min-height:56px}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.item .name{font-weight:500;overflow-wrap:anywhere}
.count{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 10px;flex:none}
.count.has{background:var(--accent-soft);color:var(--accent)}
.chev{color:var(--muted);flex:none}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:center;min-width:0}
.tile:hover{background:var(--surface-2)}
.tile svg{width:44px;height:44px;color:var(--muted);stroke-width:1.4}
.tile.has svg{color:var(--accent);fill:var(--accent-soft)}
.tile .name{font-weight:500;overflow-wrap:anywhere;line-height:1.5}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}

.search{display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
.field input,.field select,.field textarea,.search input{min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;color:var(--ink);font-size:1rem;width:100%;min-width:0}
.field textarea{min-height:96px;resize:vertical;line-height:1.7}
.daterow{display:flex;gap:8px;align-items:end}
.daterow .field{flex:1;min-width:0}

.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.notice .btn{align-self:flex-start;background:transparent;border-color:currentColor;color:inherit}

.excuse{display:flex;gap:12px;align-items:flex-start}
.thumb{width:64px;height:84px;border-radius:8px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);flex:none;display:grid;place-items:center;color:var(--muted)}
.chip{display:inline-block;font-size:.8rem;font-weight:600;padding:1px 10px;border-radius:999px;color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent);align-self:flex-start}
.dates{font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}

.lock{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:380px;margin-inline:auto;width:100%}
.lock .mark{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.err{color:var(--danger);font-size:.9rem;min-height:1.4em}

#modal{position:fixed;inset:0;z-index:30;background:rgba(10,20,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet form{display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.full-img{max-width:100%;border-radius:10px;border:1px solid var(--line);align-self:center}
.prev{display:flex;gap:12px;align-items:center}
#toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.92rem;max-width:calc(100% - 32px);text-align:center}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.count.warn{background:var(--warn-bg);color:var(--warn-ink)}
.photos{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:40px}
.ph{position:relative;display:block}
.ph-x{position:absolute;top:-8px;inset-inline-start:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;padding:0}
.ph-x svg{width:16px;height:16px}
.more{font-size:.8rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:1.6rem;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{min-height:38px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:.9rem}
.chipbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.meters{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.meter{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2.5em;gap:10px;align-items:center;font-size:.92rem}
.meter-track{display:block;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter-fill{display:block;height:100%;border-radius:99px}
.meter .num{text-align:left;font-variant-numeric:tabular-nums;color:var(--muted)}
.gallery{display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }
</style>
</head>
<body>

<div id="app" dir="rtl" lang="ar">
  <header class="bar" id="bar" hidden>
    <div class="wrap">
      <button class="icon-btn" id="backBtn" data-act="back" aria-label="رجوع" hidden><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <h1 id="barTitle">سجل أعذار الطالبات</h1>
      <button class="icon-btn" data-act="settings" aria-label="الإعدادات والنسخ الاحتياطي"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.2-1.3L14 3h-4l-.4 2.5a7 7 0 0 0-2.2 1.3l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .9.1 1.3l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.2 1.3L10 21h4l.4-2.5a7 7 0 0 0 2.2-1.3l2.3 1 2-3.4-2-1.5c.1-.4.1-.9.1-1.3z"/></svg></button>
      <button class="icon-btn" data-act="lock" aria-label="قفل التطبيق"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
    </div>
  </header>
  <main class="wrap" id="view"></main>
  <div id="modal" hidden></div>
  <div id="toast" role="status" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(() => {
'use strict';
document.documentElement.dir = 'rtl'; document.documentElement.lang = 'ar';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const norm = s => String(s || '').toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const CATS = [['medical','مرضي'],['appt','موعد مستشفى'],['family','ظرف عائلي'],['death','حالة وفاة'],['travel','سفر'],['other','أخرى']];
const catName = k => (CATS.find(c => c[0] === k) || CATS[5])[1];
let fmtH = null; try { fmtH = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', {day:'numeric', month:'long', year:'numeric'}); } catch (e) {}
const hijri = iso => { try { return fmtH ? fmtH.format(new Date(iso + 'T12:00:00')) : ''; } catch (e) { return ''; } };
const IC = {
  chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  cam:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  img:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>',
  file:'<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>',
  pdf:'<svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chart:'<svg viewBox="0 0 24 24"><path d="M5 20V11M11 20V5M17 20v-7M3 20h18"/></svg>',
  share:'<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>',
  move:'<svg viewBox="0 0 24 24"><path d="M4 12h14M13 7l5 5-5 5"/></svg>'
};
/* أيام الدوام بين تاريخين (بدون الجمعة والسبت) */
const pad2 = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
function schoolDays(a, b) {
  const s = new Date(a + 'T12:00:00'), e = new Date((b || a) + 'T12:00:00');
  if (isNaN(s) || isNaN(e) || e < s) return 1;
  let n = 0; for (let d = new Date(s), i = 0; d <= e && i < 400; d.setDate(d.getDate() + 1), i++) { const w = d.getDay(); if (w !== 5 && w !== 6) n++; }
  return Math.max(1, n);
}
const endOf = e => e.dateTo && e.dateTo > e.date ? e.dateTo : e.date;
const daysOf = e => Math.max(1, parseInt(e.days, 10) || 1);
const dayWord = n => n === 1 ? 'يوم واحد' : n === 2 ? 'يومان' : n <= 10 ? n + ' أيام' : n + ' يوماً';
const photosOf = e => Array.isArray(e.photos) ? e.photos : (e.hasImage ? [{id:e.id, thumb:e.thumb}] : []);
const safeName = t => String(t).replace(/[\\/:*?"<>|]/g, '-');
const canShare = files => { try { return !!(navigator.share && navigator.canShare && navigator.canShare({files})); } catch (e) { return false; } };
function dataUrlToFile(d, name) { const b = atob(d.split(',')[1] || ''), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new File([u], name, {type:'image/jpeg'}); }

/* ---------- التخزين: IndexedDB داخل الجهاز، مع بديل مؤقت في الذاكرة ---------- */
const STORES = ['meta','classes','students','excuses','images'];
let idb = null; const mem = {}; STORES.forEach(s => mem[s] = new Map());
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
function openDB() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('excuses-register', 1);
      r.onupgradeneeded = () => STORES.forEach(s => { if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, {keyPath:'id'}); });
      r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
}
const raw = {
  put: (s, v) => idb ? rq(idb.transaction(s, 'readwrite').objectStore(s).put(v)) : Promise.resolve(mem[s].set(v.id, v)),
  get: (s, id) => idb ? rq(idb.transaction(s).objectStore(s).get(id)) : Promise.resolve(mem[s].get(id)),
  all: s => idb ? rq(idb.transaction(s).objectStore(s).getAll()) : Promise.resolve([...mem[s].values()]),
  del: (s, id) => idb ? rq(idb.transaction(s, 'readwrite').objectStore(s).delete(id)) : Promise.resolve(mem[s].delete(id)),
  clear: s => idb ? rq(idb.transaction(s, 'readwrite').objectStore(s).clear()) : Promise.resolve(mem[s].clear())
};
/* التشفير: مفتاح بيانات عشوائي AES-GCM، يُقفل بمفتاح مشتق من رمز الدخول (PBKDF2). الرمز نفسه لا يُحفظ. */
let DK = null; const ENC = ['classes','students','excuses','images'], ITER = 250000;
const hasCrypto = !!(window.crypto && crypto.subtle);
const b64 = buf => { const u = new Uint8Array(buf); let t = ''; for (let i = 0; i < u.length; i += 32768) t += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(t); };
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function kekFrom(pin, salt, iter) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
const newDK = () => crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
async function wrapKey(pin) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const wrapped = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, await kekFrom(pin, salt, ITER), await crypto.subtle.exportKey('raw', DK)));
  await raw.put('meta', {id:'key', salt, iv, wrapped, iter:ITER});
}
async function openKey(pin, rec) {
  try { const r = await crypto.subtle.decrypt({name:'AES-GCM', iv:rec.iv}, await kekFrom(pin, rec.salt, rec.iter), rec.wrapped); return await crypto.subtle.importKey('raw', r, 'AES-GCM', true, ['encrypt','decrypt']); }
  catch (e) { return null; }
}
async function enc(v) { const iv = crypto.getRandomValues(new Uint8Array(12)); return {id:v.id, iv, ct:new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, DK, new TextEncoder().encode(JSON.stringify(v))))}; }
async function dec(r) { if (!r || !r.ct) return r; return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:r.iv}, DK, r.ct))); }
const isEnc = s => ENC.includes(s);
const db = {
  put: async (s, v) => raw.put(s, isEnc(s) ? await enc(v) : v),
  get: async (s, id) => isEnc(s) ? dec(await raw.get(s, id)) : raw.get(s, id),
  all: async s => isEnc(s) ? Promise.all((await raw.all(s)).map(dec)) : raw.all(s),
  del: raw.del, clear: raw.clear
};
async function migratePlain() {
  const f = await raw.get('meta', 'enc'); if (f) return;
  for (const s of ENC) for (const r of await raw.all(s)) if (r && !r.ct) await raw.put(s, await enc(r));
  await raw.put('meta', {id:'enc', done:true});
}

/* ---------- الحالة ---------- */
const S = {classes:[], students:[], excuses:[], demo:false, school:{}, prefs:{}, lastBackup:0};
let nav = [{v:'home'}], q = '', qd = '', unlocked = false;
const cls = id => S.classes.find(c => c.id === id);

  try { const h = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }

}

  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * r)); c.height = Math.max(1, Math.round(h * r));
  const x = c.getContext('2d', {willReadFrequently:true}); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);

}

}

}

  const cats = CATS.map(([k, l]) => ({k, l, n:0, d:0})); list.forEach(e => { const c = cats.find(c => c.k === e.category) || cats[5]; c.n++; c.d += daysOf(e); });
  const classes = S.classes.map(c => { const ids = new Set(stuOf(c.id).map(s => s.id)), l = list.filter(e => ids.has(e.studentId)); return {c, n:l.length, d:l.reduce((a, e) => a + daysOf(e), 0)}; });

}

    if (f.id === 'schoolForm') {
      const cl = id => $(id).value.replace(/\s+/g, ' ').trim();
      S.school = {id:'school', school:cl('#scSchool'), admin:cl('#scAdmin'), principal:cl('#scPrincipal')};
      await raw.put('meta', S.school); toast('حُفظت بيانات المدرسة');
    } else if (f.id === 'prefsForm') {
      S.prefs = {id:'prefs', alertDays:Math.min(99, Math.max(1, parseInt($('#pfAlert').value, 10) || 5)), autoLock:Number($('#pfLock').value) || 0};
      await raw.put('meta', S.prefs); toast('حُفظت الإعدادات');
    } else if (f.id === 'createForm') {
      const a = $('#pin1').value.trim(), b = $('#pin2').value.trim();
      if (a.length < 6) return $('#lockErr').textContent = 'الرمز يجب أن يكون 6 خانات على الأقل.';
      if (a !== b) return $('#lockErr').textContent = 'الرمزان غير متطابقين.';
      DK = await newDK(); await wrapKey(a); await raw.put('meta', {id:'enc', done:true}); await enter();
    } else if (f.id === 'unlockForm') {
      const pin = $('#pin1').value.trim(), k = await raw.get('meta', 'key');
      const bad = () => { $('#pin1').value = ''; $('#lockErr').textContent = 'رمز الدخول غير صحيح.'; };
      $('#lockErr').textContent = 'جارٍ الفتح…';
      if (k) { DK = await openKey(pin, k); if (!DK) return bad(); }
      else {
        const p = await raw.get('meta', 'pin'); if (await hashPin(pin, p.salt) !== p.hash) return bad();
        DK = await newDK(); await wrapKey(pin); await raw.del('meta', 'pin');
      }
      await enter();
    } else if (f.id === 'pinForm') {
      const k = await raw.get('meta', 'key'), n = $('#pinNew').value.trim();
      if (!(await openKey($('#pinOld').value.trim(), k))) return $('#pinErr').textContent = 'الرمز الحالي غير صحيح.';
      if (n.length < 6) return $('#pinErr').textContent = 'الرمز الجديد يجب أن يكون 6 خانات على الأقل.';
      await wrapKey(n); closeModal(); toast('تم تغيير رمز الدخول');
    } else if (f.id === 'nameForm') {
      const v = $('#nameInput').value.replace(/\s+/g, ' ').trim(), kind = f.dataset.kind; if (!v) return;
      if (kind === 'addClass') { const c = {id:'c' + uid(), name:v, created:Date.now()}; await db.put('classes', c); S.classes.push(c); closeModal(); go({v:'cls', id:c.id}); return; }
      const o = kind === 'renameClass' ? cls(topId()) : stu(topId()); o.name = v; await db.put(kind === 'renameClass' ? 'classes' : 'students', o); closeModal(); render();
    } else if (f.id === 'bulkForm') {
      const cid = topId(), have = new Set(stuOf(cid).map(s => norm(s.name))), names = bulkNames().filter(n => !have.has(norm(n)));
      if (!names.length) return toast('لا توجد أسماء جديدة للإضافة');
      for (const name of names) { const s = {id:'s' + uid(), classId:cid, name}; await db.put('students', s); S.students.push(s); }
      closeModal(); render(); toast('أُضيفت ' + names.length + ' طالبة');
    } else if (f.id === 'exForm') {
      const date = $('#exDate').value, to = $('#exTo').value || date; if (!date) return toast('اختاري تاريخ العذر');
      if (to < date) return toast('تاريخ النهاية قبل تاريخ البداية');
      if (!fp) return;
      $('#exSave').disabled = true;
      const old = f.dataset.id ? S.excuses.find(x => x.id === f.dataset.id) : null;
      const ex = old || {id:'e' + uid(), studentId:topId(), created:Date.now()};
      ex.date = date; ex.dateTo = to; ex.days = Math.max(1, parseInt($('#exDays').value, 10) || schoolDays(date, to));
      ex.category = $('#exCat').value; ex.notes = $('#exNotes').value.trim();
      for (const p of fp.list) if (!p.id) { const id = 'i' + uid(); await db.put('images', {id, data:p.full}); p.id = id; delete p.full; }
      for (const id of fp.removed) await db.del('images', id);
      ex.photos = fp.list.map(p => ({id:p.id, thumb:p.thumb})); ex.thumb = ex.photos.length ? ex.photos[0].thumb : ''; ex.hasImage = ex.photos.length > 0;
      await db.put('excuses', ex); if (!old) S.excuses.push(ex);
      closeModal(); render(); toast('حُفظ العذر');
    }
  } catch (err) {
    console.error(err); const b = $('#exSave'); if (b) b.disabled = false;
    toast(err && err.name === 'QuotaExceededError' ? 'مساحة التخزين ممتلئة. احفظي نسخة احتياطية واحذفي أعذاراً قديمة.' : 'تعذر الحفظ، أعيدي المحاولة');
  }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
openDB().then(d => { idb = d; return renderLock(); }).catch(() => renderLock());
})();
</script>
</body>
</html>
